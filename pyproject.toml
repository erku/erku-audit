[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "f916-community-agent"
version = "0.1.0"
description = "Lokalny audytor społeczności 1F916"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1.6,<4", "python-multipart>=0.0.20,<1", "cryptography>=44,<47"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["f916*", "dashboard*", "defense*", "tuner*"]

[tool.setuptools.package-data]
dashboard = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
