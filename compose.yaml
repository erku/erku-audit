x-common: &common
  build: .
  image: f916-local:latest
  env_file: .env
  environment:
    DATA_DIR: /data
    OLLAMA_URL: http://host.docker.internal:11434
    OLLAMA_MODEL: deepseek-v4-flash:cloud
  volumes:
    - ./data:/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 512m
  cpus: 1.0
  restart: unless-stopped
  init: true

services:
  worker:
    <<: *common
    command: [python, -m, f916.loop]
  dashboard:
    <<: *common
    command: [python, -m, uvicorn, dashboard.app:app, --host, 0.0.0.0, --port, '8080', --no-proxy-headers]
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s
  # Least-privilege GitHub broker. Dormant by default: it is only started
  # under the "broker" profile AFTER the operator runs scripts/broker_bootstrap.py
  # to create ./secrets/github_token. It alone holds the GitHub token; the
  # worker reaches it in-network as http://broker:8090 with BROKER_TOKEN (set
  # in .env). MUST stay single-worker (see broker/app.py) — state serialisation
  # is in-process only. Not published to the host.
  broker:
    <<: *common
    profiles: ["broker"]
    command: [python, -m, uvicorn, broker.app:app, --host, 0.0.0.0, --port, '8090', --workers, '1', --no-proxy-headers]
    environment:
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      BROKER_STATE_FILE: /data/broker_state.json
    volumes:
      - ./data:/data
      - ./secrets/github_token:/run/secrets/github_token:ro
    expose:
      - "8090"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s
  # Isolated test sandbox runner (Task S). Deliberately NOT built on the
  # x-common anchor: it must never receive env_file .env / API_KEY. It talks
  # to the worker ONLY via the shared sandbox-jobs volume (file IPC) and has
  # no network access at all, so it is safe to run LLM-generated project
  # tests here. Dormant by default: only started under the "sandbox" profile.
  sandbox-runner:
    build: .
    image: f916-local:latest
    profiles: ["sandbox"]
    command: [python, -m, sandbox.runner]
    environment:
      SANDBOX_JOBS_DIR: /data/sandbox-jobs
      SANDBOX_TIMEOUT_SECONDS: '120'
    volumes:
      - ./data/sandbox-jobs:/data/sandbox-jobs
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    init: true
